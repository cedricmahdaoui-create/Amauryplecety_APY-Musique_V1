# Configuration de l'éditeur en ligne Decap CMS (utilisé par /admin/cms.html).
# Voir README § Administration. Sans Netlify + dépôt Git, ignorer ce fichier
# et utiliser l'éditeur hors ligne (/admin/).

backend:
  name: git-gateway
  branch: main            # adapter au nom de la branche principale du dépôt

media_folder: "assets/img"
public_folder: "/assets/img"

locale: "fr"
site_url: "https://cedricmahdaoui-create.github.io"
display_url: "https://cedricmahdaoui-create.github.io"
logo_url: "https://cedricmahdaoui-create.github.io/assets/img/logo.svg"

collections:
  - name: "catalogue"
    label: "Catalogue"
    description: "Les instruments à vendre affichés sur /catalogue.html"
    files:
      - name: "instruments"
        label: "Instruments à vendre"
        file: "assets/data/catalogue.json"
        fields:
          - name: "instruments"
            label: "Instruments"
            label_singular: "Instrument"
            widget: "list"
            summary: "{{fields.nom}}"
            fields:
              - { name: "nom", label: "Nom", widget: "string" }
              - name: "famille"
                label: "Famille"
                widget: "select"
                default: "vent"
                options:
                  - { label: "Instrument à vent", value: "vent" }
                  - { label: "Cordes — quatuor", value: "cordes" }
                  - { label: "Percussion", value: "percussion" }
                  - { label: "Accessoire / pièce", value: "accessoire" }
              - { name: "sousfamille", label: "Sous-famille (Saxophone alto, Violon…)", widget: "string", required: false }
              - name: "etat"
                label: "État"
                widget: "select"
                default: "revise"
                options:
                  - { label: "Révisé, prêt à jouer", value: "revise" }
                  - { label: "À restaurer", value: "a-restaurer" }
                  - { label: "Pièce détachée", value: "piece" }
              - { name: "prix", label: "Prix en euros (0 = prix sur demande)", widget: "number", value_type: "int", min: 0, default: 0 }
              - { name: "dispo", label: "Disponible immédiatement", widget: "boolean", default: true }
              - { name: "annee", label: "Année (texte libre)", widget: "string", required: false }
              - { name: "photo", label: "Photo", widget: "image", required: false, choose_url: false, media_library: { config: { max_file_size: 5000000 } } }
              - { name: "desc", label: "Description (1 à 2 phrases)", widget: "text", required: false }
